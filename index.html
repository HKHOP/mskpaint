<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b22" />
  <title>MSK Paint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script type="module" crossorigin src="./assets/index-Cbu3KTGI.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D7urY5dT.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="tb-btn" id="btnGallery" title="Gallery"><span class="msr">menu</span></button>
      <button class="tb-btn" id="btnUndo" title="Undo"><span class="msr">undo</span></button>
      <button class="tb-btn" id="btnRedo" title="Redo"><span class="msr">redo</span></button>
      <div class="slider-group">
        <span class="slider-label">Opacity</span>
        <input type="range" id="opacitySlider" min="1" max="100" value="100" />
        <span id="opacityValue" class="slider-value">100</span>
      </div>
      <button class="tb-btn" id="btnExport" title="Export PNG"><span class="msr">upload</span></button>
      <button class="tb-btn" id="btnFit" title="Fit view"><span class="msr">fit_screen</span></button>
      <span id="zoomValue" class="slider-value">100%</span>
    </header>

    <div id="transformBar">
      <button id="tfFlipH" title="Flip horizontal"><span class="msr">flip</span></button>
      <button id="tfFlipV" title="Flip vertical"><span class="msr flip-v">flip</span></button>
      <div class="slider-group">
        <span class="slider-label">Scale</span>
        <input type="range" id="tfScale" min="10" max="300" value="100" />
        <span class="slider-value">%</span>
      </div>
      <div class="slider-group">
        <span class="slider-label">Rotate</span>
        <input type="range" id="tfRot" min="-180" max="180" value="0" />
        <span class="slider-value">&deg;</span>
      </div>
      <button id="tfApply" title="Apply" class="tf-ok"><span class="msr">check</span></button>
      <button id="tfCancel" title="Cancel" class="tf-no"><span class="msr">close</span></button>
    </div>

    <main id="canvasArea">
      <canvas id="display"></canvas>
    </main>

    <footer id="bottombar">
      <button class="bb-btn" id="btnLayers" title="Layers">
        <span class="msr">layers</span><span class="bb-label">Layers</span>
      </button>
      <button class="bb-btn active" id="btnBrush" title="Brush">
        <span class="msr">brush</span><span class="bb-label">Brush</span>
      </button>
      <button class="bb-btn" id="btnEraser" title="Eraser">
        <span class="msr">ink_eraser</span><span class="bb-label">Eraser</span>
      </button>
      <button class="bb-btn" id="btnTools" title="Tools">
        <span class="msr">category</span><span class="bb-label">Tools</span>
      </button>
      <div class="slider-group">
        <span class="slider-label">Size</span>
        <input type="range" id="sizeSlider" min="1" max="200" value="8" />
        <span id="sizeValue" class="slider-value">8</span>
      </div>
      <button class="bb-btn" id="btnColor" title="Color">
        <span id="colorSwatch"></span><span class="bb-label">Color</span>
      </button>
    </footer>

    <div class="panel" id="brushPanel">
      <div class="panel-header">
        <span>Brush</span>
        <button class="panel-close" data-close="brushPanel"><span class="msr">close</span></button>
      </div>
      <div id="brushList"></div>
      <div class="color-row"><span>Stab</span>
        <input type="range" id="stabSlider" min="0" max="100" value="50" />
        <span id="stabValue" class="slider-value">50</span>
      </div>
    </div>

    <div class="panel" id="colorPanel">
      <div class="panel-header">
        <span>Color</span>
        <button class="panel-close" data-close="colorPanel"><span class="msr">close</span></button>
      </div>
      <div id="colorPreview"><span id="colorHex">#FF0000</span></div>
      <div class="color-row"><span>H</span><input type="range" id="hueSlider" min="0" max="360" value="0" /></div>
      <div class="color-row"><span>S</span><input type="range" id="satSlider" min="0" max="100" value="100" /></div>
      <div class="color-row"><span>V</span><input type="range" id="valSlider" min="0" max="100" value="100" /></div>
      <div id="swatchPresets"></div>
    </div>

    <div class="panel" id="toolsPanel">
      <div class="panel-header">
        <span>Tools</span>
        <button class="panel-close" data-close="toolsPanel"><span class="msr">close</span></button>
      </div>
      <div id="toolsList"></div>
    </div>

    <div class="panel" id="textPanel">
      <div class="panel-header">
        <span>Text</span>
        <button class="panel-close" data-close="textPanel"><span class="msr">close</span></button>
      </div>
      <input type="text" id="textInput" value="Hello" placeholder="Type text, then tap the canvas" />
      <div class="color-row"><span>Size</span>
        <input type="range" id="textSize" min="12" max="300" value="64" />
        <span id="textSizeValue" class="slider-value">64</span>
      </div>
      <div class="text-hint">Tap the canvas to place the text.</div>
    </div>

    <div class="panel" id="layersPanel">
      <div class="panel-header">
        <span>Layers</span>
        <button class="panel-close" data-close="layersPanel"><span class="msr">close</span></button>
      </div>
      <div id="layersList"></div>
      <div id="layerControls"></div>
      <div class="panel-footer">
        <button id="btnAddLayer" title="Add"><span class="msr">add</span></button>
        <button id="btnImportLayer" title="Import image"><span class="msr">add_photo_alternate</span></button>
        <button id="btnDupLayer" title="Duplicate"><span class="msr">content_copy</span></button>
        <button id="btnMergeLayer" title="Merge down"><span class="msr">call_merge</span></button>
        <button id="btnLayerUp" title="Move up"><span class="msr">arrow_upward</span></button>
        <button id="btnLayerDown" title="Move down"><span class="msr">arrow_downward</span></button>
        <button id="btnClearLayer" title="Clear layer"><span class="msr">layers_clear</span></button>
        <button id="btnDeleteLayer" title="Delete"><span class="msr">delete</span></button>
      </div>
      <input type="file" id="importFile" accept="image/*" hidden />
    </div>
    <div id="galleryOverlay">
      <div class="panel-header">
        <span>Gallery</span>
        <button id="galleryClose"><span class="msr">close</span></button>
      </div>
      <div class="gallery-actions">
        <button id="galleryNew"><span class="msr">add</span> New</button>
        <button id="gallerySave"><span class="msr">save</span> Save current</button>
      </div>
      <div id="galleryGrid"></div>
    </div>
  </div>
</body>
</html>
